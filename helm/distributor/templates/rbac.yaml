{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distributor.fullname" . }}
  labels:
    {{- include "distributor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distributor.fullname" . }}
  labels:
    {{- include "distributor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "distributor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distributor.fullname" . }}
{{- end }}
