openapi: 3.0.3
info:
  title: Config Distributor API
  version: "0.1.0"
  description: REST API for distributing ConfigMap/Secret values via JetStream KV
servers:
  - url: http://localhost:8080
paths:
  /namespaces/{namespace}/configmap:
    get:
      summary: List ConfigMaps (from KV cache)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of ConfigMaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /namespaces/{namespace}/configmap/{name}:
    get:
      summary: Get ConfigMap (from KV cache)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ConfigMap value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create or update ConfigMap (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "app: appA\nversion: 1\n"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      summary: Create or update ConfigMap (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "app: appA\nversion: 1\n"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete ConfigMap (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /namespaces/{namespace}/secret:
    get:
      summary: List Secrets (from KV cache)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of Secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /namespaces/{namespace}/secret/{name}:
    get:
      summary: Get Secret (from KV cache)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create or update Secret (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "password=supersecret"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      summary: Create or update Secret (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "password=supersecret"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete Secret (applies to K8s, then KV)
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  schemas:
    ItemResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
        name:
          type: string
        revision:
          type: integer
          format: int64
        value:
          type: string
    ListResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
    WriteResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
        name:
          type: string
        revision:
          type: integer
          format: int64
        k8sResourceVer:
          type: string
        k8sResourceKind:
          type: string
        k8sResourceName:
          type: string
        k8sResourceScope:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
