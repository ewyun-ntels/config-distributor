openapi: 3.0.3
info:
  title: Config Distributor API
  version: "0.1.0"
  description: REST API for storing ConfigMap values in NATS JetStream KV.
servers:
  - url: http://localhost:8080
paths:
  /namespaces/{namespace}/configmap:
    get:
      summary: List ConfigMaps from the local KV cache
      parameters:
        - $ref: "#/components/parameters/Namespace"
      responses:
        "200":
          description: List of ConfigMap values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /namespaces/{namespace}/configmap/{name}:
    get:
      summary: Get a ConfigMap value from the local cache or KV
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: ConfigMap value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Store raw text value in KV
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      requestBody:
        $ref: "#/components/requestBodies/RawConfigValue"
      responses:
        "200":
          description: KV write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      summary: Store raw text value in KV
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      requestBody:
        $ref: "#/components/requestBodies/RawConfigValue"
      responses:
        "200":
          description: KV write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete ConfigMap value from KV
      description: The periodic ConfigMap mirror is not deleted automatically.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "204":
          description: Deleted from KV
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    RawConfigValue:
      required: true
      content:
        text/plain:
          schema:
            type: string
            example: "app: appA\nversion: 1\n"
        application/json:
          schema:
            type: string
            example: "{\"app\":\"appA\",\"version\":\"1\"}"
  schemas:
    ItemResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
          example: configmap
        name:
          type: string
        revision:
          type: integer
          format: int64
        value:
          type: string
    ListResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
          example: configmap
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
    WriteResponse:
      type: object
      properties:
        namespace:
          type: string
        kind:
          type: string
          example: configmap
        name:
          type: string
        revision:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
